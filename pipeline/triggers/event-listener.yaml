apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-listener
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        # main ブランチへの push のみ対象。Pipeline 自身のマニフェスト更新コミットは無視
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                !body.head_commit.message.contains('[skip ci]')
      bindings:
        - ref: github-push-binding
      template:
        ref: demo-app-trigger-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-github-listener
spec:
  to:
    kind: Service
    name: el-github-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
